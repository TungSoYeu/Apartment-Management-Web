<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Quản Trị - Admin Dashboard</title>
    <style>
      /* --- CSS STYLES --- */
      :root {
        --primary: #4f46e5;
        --bg: #f3f4f6;
        --text: #1f2937;
        --white: #ffffff;
        --danger: #ef4444;
        --info: #3b82f6;
        --warning: #f59e0b;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: var(--bg);
        margin: 0;
        color: var(--text);
      }

      /* Login & Layout */
      #login-section {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .login-card {
        background: var(--white);
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
      }
      #dashboard-section {
        display: none;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* Inputs & Buttons */
      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
        transition: 0.2s;
      }
      button:hover {
        opacity: 0.9;
      }
      .btn-add {
        background-color: #10b981;
        width: auto;
      }
      .btn-logout {
        width: auto;
        background: var(--danger);
      }
      .btn-edit-user {
        background-color: var(--warning);
        width: 100%;
        margin-top: 15px;
      }

      /* --- CARD STYLES (GIAO DIỆN THẺ) --- */
      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .card {
        background: var(--white);
        border-radius: 10px;
        padding: 20px; /* Tăng padding cho thoáng */
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        border-left: 6px solid #ccc;
        transition: transform 0.2s;
        display: flex;
        flex-direction: column;
        gap: 12px; /* Khoảng cách giữa các dòng */
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
      }
      .card.occupied {
        border-left-color: #10b981;
      }
      .card.vacant {
        border-left-color: #9ca3af;
      }

      /* HÀNG 1: TRẠNG THÁI & NÚT BẤM (Nằm riêng 1 dòng) */
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 30px;
      }

      .status-badge {
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: bold;
        background: #eee;
        display: inline-block;
      }
      .card.occupied .status-badge {
        background: #d1fae5;
        color: #065f46;
      }

      .card-actions {
        display: flex;
        gap: 8px;
      }
      .btn-icon {
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.9rem;
        color: white;
        border: none;
        cursor: pointer;
      }
      .btn-edit {
        background-color: var(--warning);
      }
      .btn-delete {
        background-color: var(--danger);
      }

      /* HÀNG 2: MÃ CĂN HỘ (To, rõ ràng) */
      .card h3 {
        margin: 0;
        font-size: 2rem;
        color: var(--primary);
        font-weight: 800;
      }

      /* CÁC HÀNG THÔNG TIN (Có đường kẻ mờ ngăn cách) */
      .info-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.95rem;
        color: #555;
        border-bottom: 1px dashed #eee;
        padding-bottom: 8px;
      }
      .info-row:last-child {
        border-bottom: none;
      }

      .owner-link {
        color: var(--info);
        cursor: pointer;
        text-decoration: underline;
        font-weight: bold;
      }
      .owner-link:hover {
        color: var(--primary);
      }

      /* Modal Styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
      }
      .modal-content {
        background-color: white;
        padding: 25px;
        border-radius: 10px;
        width: 400px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        position: relative;
      }
      .close-btn {
        position: absolute;
        right: 20px;
        top: 15px;
        font-size: 24px;
        cursor: pointer;
        color: #aaa;
      }
      .close-btn:hover {
        color: black;
      }
      .owner-detail-row {
        border-bottom: 1px solid #eee;
        padding: 10px 0;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div id="login-section">
      <div class="login-card">
        <h2>🔑 Admin Portal</h2>
        <p>Hệ thống quản lý chung cư</p>
        <input
          type="email"
          id="email"
          placeholder="Email"
          value="admin@test.com"
        />
        <input
          type="password"
          id="password"
          placeholder="Password"
          value="123456"
        />
        <button onclick="handleLogin()">Đăng Nhập</button>
        <p id="error-msg" style="color: red; margin-top: 10px"></p>
      </div>
    </div>

    <div id="dashboard-section">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 30px;
          border-bottom: 2px solid #eee;
          padding-bottom: 20px;
        "
      >
        <div>
          <h1 style="margin: 0; color: var(--primary)">🏢 Quản Lý Căn Hộ</h1>
          <p style="margin: 5px 0 0 0; color: #666">
            Danh sách toàn bộ căn hộ trong hệ thống
          </p>
        </div>
        <div style="display: flex; gap: 10px">
          <button
            id="btn-create-apt"
            class="btn-add"
            onclick="openAddModal()"
            style="display: none"
          >
            + Thêm Căn Hộ
          </button>
          <button class="btn-logout" onclick="logout()">Thoát</button>
        </div>
      </div>
      <div id="apartment-grid" class="grid-container"></div>
    </div>

    <div id="aptModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal('aptModal')">&times;</span>
        <h2 id="modal-title">Căn Hộ</h2>
        <form id="aptForm" onsubmit="handleSaveApartment(event)">
          <input type="hidden" id="apt-id" />
          <label>Mã căn hộ:</label>
          <input type="text" id="apt-code" placeholder="Ví dụ: B505" required />
          <div style="display: flex; gap: 10px">
            <div style="flex: 1">
              <label>Block:</label>
              <input
                type="text"
                id="apt-block"
                placeholder="Ví dụ: B"
                required
              />
            </div>
            <div style="flex: 1">
              <label>Tầng:</label>
              <input
                type="number"
                id="apt-floor"
                placeholder="Ví dụ: 5"
                required
              />
            </div>
          </div>
          <label>Diện tích (m2):</label>
          <input type="number" id="apt-area" placeholder="100" required />
          <label>Trạng thái:</label>
          <select id="apt-status">
            <option value="VACANT">Trống (Chưa có người)</option>
            <option value="OCCUPIED">Đang ở (Có cư dân)</option>
            <option value="MAINTENANCE">Đang bảo trì</option>
          </select>
          <button type="submit" style="margin-top: 15px">Lưu Thông Tin</button>
        </form>
      </div>
    </div>

    <div id="ownerModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal('ownerModal')"
          >&times;</span
        >
        <h2>👤 Hồ Sơ Chủ Hộ</h2>
        <div id="owner-info-content" style="margin: 20px 0"></div>
      </div>
    </div>

    <div id="editOwnerModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal('editOwnerModal')"
          >&times;</span
        >
        <h2>✏️ Cập Nhật Cư Dân</h2>
        <form onsubmit="handleUpdateOwner(event)">
          <input type="hidden" id="edit-owner-id" />
          <label>Họ và tên đầy đủ:</label>
          <input type="text" id="edit-owner-name" required />
          <label>Email liên hệ:</label>
          <input type="email" id="edit-owner-email" required />
          <label>Số điện thoại:</label>
          <input type="text" id="edit-owner-phone" required />
          <button type="submit" style="margin-top: 15px">Lưu Thay Đổi</button>
        </form>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:3000/api/v1";
      let token = localStorage.getItem("token");
      let userRole = localStorage.getItem("role");
      let isEditing = false;

      if (token) showDashboard();

      // --- AUTH ---
      async function handleLogin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        try {
          const res = await fetch(`${API_URL}/users/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("role", data.user.role);
            token = data.token;
            userRole = data.user.role;
            showDashboard();
          } else document.getElementById("error-msg").innerText = data.message;
        } catch (err) {
          alert("Lỗi kết nối Server! Hãy kiểm tra xem Server đã bật chưa?");
        }
      }

      function logout() {
        localStorage.clear();
        location.reload();
      }

      // --- DASHBOARD ---
      function showDashboard() {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("dashboard-section").style.display = "block";
        if (userRole === "ADMIN")
          document.getElementById("btn-create-apt").style.display = "block";
        loadApartments();
      }

      async function loadApartments() {
        try {
          const res = await fetch(`${API_URL}/apartments`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();
          const grid = document.getElementById("apartment-grid");
          grid.innerHTML = "";

          if (data.data.length === 0) {
            grid.innerHTML =
              '<p style="text-align:center; width:100%;">Chưa có dữ liệu căn hộ nào.</p>';
            return;
          }

          data.data.forEach((apt) => {
            const statusClass =
              apt.status === "OCCUPIED" ? "occupied" : "vacant";
            const statusText =
              apt.status === "OCCUPIED" ? "Đã có người" : "Trống";

            const actions =
              userRole === "ADMIN"
                ? `
                        <div class="card-actions">
                            <button class="btn-icon btn-edit" title="Sửa căn hộ" onclick="openEditModal('${apt._id}', '${apt.code}', '${apt.block}', '${apt.floor}', '${apt.area}', '${apt.status}')">✏️</button>
                            <button class="btn-icon btn-delete" title="Xóa căn hộ" onclick="handleDelete('${apt._id}', '${apt.code}')">🗑️</button>
                        </div>
                    `
                : "<div></div>";

            // Xử lý Chủ hộ
            let ownerDisplay = "---";
            if (apt.owner) {
              const ownerData = JSON.stringify({
                id: apt.owner._id,
                name: apt.owner.fullname,
                email: apt.owner.email,
                phone: apt.owner.phone,
              }).replace(/"/g, "&quot;");

              ownerDisplay = `<span class="owner-link" onclick="showOwnerInfo(${ownerData})">${apt.owner.fullname} ℹ️</span>`;
            }

            // *** HTML GIAO DIỆN MỚI (FIX LỖI ĐÈ NÚT) ***
            const html = `
                        <div class="card ${statusClass}">
                            <div class="card-header">
                                <span class="status-badge">${statusText}</span>
                                ${actions}
                            </div>
                            
                            <h3>${apt.code}</h3>
                            
                            <div class="info-row">
                                <span>Vị trí:</span>
                                <strong>Block ${apt.block} - Tầng ${apt.floor}</strong>
                            </div>
                            
                            <div class="info-row">
                                <span>Diện tích:</span>
                                <b>${apt.area} m²</b>
                            </div>
                            
                            <div class="info-row">
                                <span>Chủ hộ:</span>
                                ${ownerDisplay}
                            </div>
                        </div>
                    `;
            grid.innerHTML += html;
          });
        } catch (err) {
          console.error(err);
          logout();
        }
      }

      // --- XỬ LÝ CHỦ HỘ ---
      function showOwnerInfo(owner) {
        const content = document.getElementById("owner-info-content");
        content.innerHTML = `
                <div class="owner-detail-row"><span>Họ tên:</span><strong>${owner.name}</strong></div>
                <div class="owner-detail-row"><span>SĐT:</span><strong>${owner.phone}</strong></div>
                <div class="owner-detail-row"><span>Email:</span><strong>${owner.email}</strong></div>
            `;

        if (userRole === "ADMIN") {
          const ownerData = JSON.stringify(owner).replace(/"/g, "&quot;");
          content.innerHTML += `
                    <button class="btn-edit-user" onclick="openEditOwnerModal(${ownerData})">Sửa Thông Tin Cư Dân</button>
                `;
        }

        document.getElementById("ownerModal").style.display = "flex";
      }

      function openEditOwnerModal(owner) {
        closeModal("ownerModal");
        document.getElementById("edit-owner-id").value = owner.id;
        document.getElementById("edit-owner-name").value = owner.name;
        document.getElementById("edit-owner-email").value = owner.email;
        document.getElementById("edit-owner-phone").value = owner.phone;
        document.getElementById("editOwnerModal").style.display = "flex";
      }

      async function handleUpdateOwner(e) {
        e.preventDefault();
        const id = document.getElementById("edit-owner-id").value;
        const payload = {
          fullname: document.getElementById("edit-owner-name").value,
          email: document.getElementById("edit-owner-email").value,
          phone: document.getElementById("edit-owner-phone").value,
        };

        try {
          const res = await fetch(`${API_URL}/users/${id}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (data.success) {
            alert("✅ Đã cập nhật thông tin chủ hộ!");
            closeModal("editOwnerModal");
            loadApartments();
          } else {
            alert("❌ Lỗi: " + data.message);
          }
        } catch (err) {
          alert("❌ Lỗi kết nối!");
        }
      }

      // --- CÁC HÀM CŨ ---
      async function handleDelete(id, code) {
        if (!confirm(`⚠️ Bạn có chắc chắn muốn XÓA căn hộ ${code} không?`))
          return;
        try {
          const res = await fetch(`${API_URL}/apartments/${id}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();
          if (data.success) {
            alert("✅ Đã xóa thành công!");
            loadApartments();
          } else alert("❌ Lỗi: " + data.message);
        } catch (err) {
          alert("❌ Lỗi kết nối!");
        }
      }

      function openAddModal() {
        isEditing = false;
        document.getElementById("modal-title").innerText = "Thêm Căn Hộ Mới";
        document.getElementById("aptForm").reset();
        document.getElementById("aptModal").style.display = "flex";
      }

      function openEditModal(id, code, block, floor, area, status) {
        isEditing = true;
        document.getElementById("modal-title").innerText = "Cập Nhật Căn Hộ";
        document.getElementById("apt-id").value = id;
        document.getElementById("apt-code").value = code;
        document.getElementById("apt-block").value = block;
        document.getElementById("apt-floor").value = floor;
        document.getElementById("apt-area").value = area;
        document.getElementById("apt-status").value = status;
        document.getElementById("aptModal").style.display = "flex";
      }

      function closeModal(id) {
        document.getElementById(id).style.display = "none";
      }
      window.onclick = function (e) {
        if (e.target.className === "modal") e.target.style.display = "none";
      };

      async function handleSaveApartment(e) {
        e.preventDefault();
        const payload = {
          code: document.getElementById("apt-code").value,
          block: document.getElementById("apt-block").value,
          floor: document.getElementById("apt-floor").value,
          area: document.getElementById("apt-area").value,
          status: document.getElementById("apt-status").value,
        };
        const aptId = document.getElementById("apt-id").value;
        const method = isEditing ? "PUT" : "POST";
        const url = isEditing
          ? `${API_URL}/apartments/${aptId}`
          : `${API_URL}/apartments`;

        try {
          const res = await fetch(url, {
            method: method,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (data.success) {
            alert(isEditing ? "✅ Cập nhật xong!" : "✅ Thêm mới xong!");
            closeModal("aptModal");
            loadApartments();
          } else alert("❌ Lỗi: " + data.message);
        } catch (err) {
          alert("❌ Lỗi kết nối!");
        }
      }
    </script>
  </body>
</html>
